# 推送 <插件名>-v<版本> 形式的 tag 时发布对应插件到 npm。
#
# 设计要点：
# 1. tag 是唯一的发布触发器，发布版本由人显式决定，与各插件 CHANGELOG 的
#    “已核对契约的最窄兼容发布线”策略一致——改代码永远不会意外发版。
# 2. 发布前断言 tag 与 package.json 的 version 完全一致，杜绝发错版本号。
# 3. 复用各插件已有的 prepublishOnly → publish:check 门禁（check/test/pack:check），
#    校验不通过时 npm 自身拒绝发布，工作流无需重复实现门禁逻辑。
# 4. private: true 的包显式拒绝发布。
# 5. --provenance 由 GitHub OIDC 身份签名，产出“该版本确由本仓库此 commit 发布”
#    的可验证证明。
#
# 认证方式：trusted publishing（OIDC），不含任何长期 token。
# - dsh-extra-context@0.1.1 已验证可自动发布，provenance 证明其来源为
#   本仓库 / refs/tags/dsh-extra-context-v0.1.1 / release.yml。
# - 配置方式：在 npmjs.com 该包设置页添加 trusted publisher：
#     组织或用户 = zhaoliang233，仓库 = dsh-plugins，
#     工作流文件名 = release.yml（只填文件名，含扩展名，大小写敏感）
# - 发布其余 6 个包前，需先各自发布一次首个版本（trusted publisher 只能配置在
#   已存在的包上），随后同样配置 trusted publisher 即可免 token 自动发布。
# - 发布报认证错误（ENEEDAUTH / Unable to authenticate）时，先核对该包的
#   trusted publisher 三个字段是否与此处完全一致（尤其工作流文件名大小写）。
name: Release to npm

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 dsh-mobile-compat-v0.3.2'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release
      id-token: write # npm --provenance 签名
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 不低于 22.14.0：trusted publishing（OIDC）的官方最低要求。
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      # trusted publishing 需要 npm CLI >= 11.5.1。
      # 注意必须固定在 11.x：Node 22.14.0 只满足 OIDC 的 Node 下限，但【不满足】
      # npm 12 的 engines（^22.22.2 || ^24.15.0 || >=26.0.0），装 npm@latest 会以
      # EBADENGINE 失败。11.x 既满足下限，也避开 npm 12 的行为变更（如 allowScripts
      # 默认关闭）。另注：该 Node 自带 npm 仅 10.9.2，故此步不可省。
      - name: 升级 npm 至 11.x（trusted publishing 要求 >= 11.5.1）
        run: npm install -g 'npm@^11.5.1'

      - name: 解析并校验 tag
        id: target
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RAW_TAG"
          echo "收到 tag：$TAG"

          # 严格匹配 <插件名>-v<版本>，插件名限定为小写字母/数字/连字符，
          # 版本号支持预发布段（如 0.1.6-alpha.1）。不匹配即终止，避免猜测式发布。
          if [[ ! "$TAG" =~ ^([a-z0-9-]+)-v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::tag 格式不合法：$TAG，应为 <插件名>-v<版本>，例如 dsh-mobile-compat-v0.3.2"
            exit 1
          fi
          PLUGIN="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"

          if [[ ! -f "$PLUGIN/package.json" ]]; then
            echo "::error::找不到插件目录 $PLUGIN（$PLUGIN/package.json 不存在）"
            exit 1
          fi

          # tag 与 package.json 必须同源，否则发布出去的版本号会与 tag 不一致。
          # 用环境变量传值、以单引号包裹 JS：绝不在双引号 shell 字符串里写 JS 模板
          # 字符串，否则 bash 会抢先展开 ${...}，把脚本内容改成语法错误的乱码。
          PLUGIN="$PLUGIN" VERSION="$VERSION" node -e '
            const fs = require("node:fs")
            const plugin = process.env.PLUGIN
            const want = process.env.VERSION
            const pkg = JSON.parse(fs.readFileSync(plugin + "/package.json", "utf8"))
            if (pkg.private === true) {
              console.error("::error::" + plugin + " 标记为 private，不应发布到 npm")
              process.exit(1)
            }
            if (pkg.version !== want) {
              console.error("::error::版本不一致：tag 为 " + want + "，但 " + plugin + "/package.json 为 " + pkg.version)
              process.exit(1)
            }
            console.log("版本一致：" + pkg.name + "@" + pkg.version)
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "package=" + pkg.name + "\n")
          '

          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 依赖安装：多数插件零依赖，但已引入运行时依赖的插件必须先装好，否则
      # 下面的 prepublishOnly 门禁会以 ERR_MODULE_NOT_FOUND 失败（现例：
      # dsh-local-plugin-manager 依赖 yaml 与 @deepseek-ai/dsh-atomic-write，
      # 其测试文件会直接 import 它们；
      # 缺这一步时只有该插件发布失败，其余零依赖插件仍会通过，症状容易被误读为
      # 认证问题）。逻辑与 ci.yml 一致：有 lockfile 用 npm ci 保证依赖树可复现，
      # 否则回退 npm install。
      - name: 安装依赖
        working-directory: ${{ steps.target.outputs.plugin }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          else
            npm install --no-audit --no-fund --registry=https://registry.npmjs.org
          fi

      - name: 发布到 npm
        working-directory: ${{ steps.target.outputs.plugin }}
        run: npm publish --provenance --access public

      - name: 验证 registry 上确实出现该版本
        run: |
          set -euo pipefail
          PKG="${{ steps.target.outputs.package }}"
          WANT="${{ steps.target.outputs.version }}"
          # registry 的可见性可能有几分钟延迟：实测有的包在 120s 内读不到、
          # 稍后才出现，故按 15s × 40 ≈ 10 分钟轮询，避免把“发布成功但回查太早”
          # 误判成失败（那会让工作流变红并跳过 GitHub Release 创建）。
          for attempt in $(seq 1 40); do
            if npm view "$PKG@$WANT" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "已确认发布：$PKG@$WANT（第 $attempt 次轮询）"
              exit 0
            fi
            echo "等待 registry 可见（第 $attempt 次）…"
            sleep 15
          done
          echo "::error::发布后无法在 registry 上读到 $PKG@$WANT"
          exit 1

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "${{ steps.target.outputs.package }}@${{ steps.target.outputs.version }}" \
            --generate-notes
